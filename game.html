<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen game-screen" id="gameScreen">
    <header class="game-header">
        <button id="backButton" class="small-btn" type="button">← Меню</button>
        <div>
            <h1>WORDLE</h1>
            <div id="difficultyLabel" class="difficulty-label"></div>
        </div>
        <div class="attempt-counter" id="attemptCounter"></div>
    </header>

    <section class="game-area">
        <div id="message" class="message" aria-live="polite"></div>
        <div id="board" class="board" aria-label="Игровое поле"></div>
        <div id="keyboard" class="keyboard" aria-label="Виртуальная клавиатура"></div>
            </section>
</main>
<script src="game.js"></script>
</body>
</html>
