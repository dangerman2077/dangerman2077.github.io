<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen result-screen" id="resultScreen">
    <section class="panel result-panel">
        <div id="resultIcon" class="result-icon"></div>
        <h1 id="resultTitle"></h1>
        <p id="resultText"></p>
        <p id="resultStats" class="result-stats"></p>
        <div class="result-actions">
            <button id="againButton" class="submit-btn" type="button">Играть ещё раз</button>
            <button id="menuButton" class="small-btn" type="button">Главное меню</button>
        </div>
    </section>
</main>
<script src="result.js"></script>
</body>
</html>
