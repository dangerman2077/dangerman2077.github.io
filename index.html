<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen menu-screen" id="menuScreen">
    <section class="panel menu-panel">
        <h1>WORDLE</h1>
        <p class="description">Угадайте слово за ограниченное число попыток.</p>
        <div class="difficulty" id="difficulty" name="difficulty">
            <button class="difficulty-btn" data-difficulty="easy" data-attempts="7">Легко <span>7 попыток</span></button>
            <button class="difficulty-btn" data-difficulty="normal" data-attempts="6">Нормально <span>6 попыток</span></button>
            <button class="difficulty-btn" data-difficulty="hard" data-attempts="4">Сложно <span>4 попытки</span></button>
        </div>
        <p class="hint">Слово состоит из 5 букв.</p>
    </section>
</main>
<script src="menu.js"></script>
</body>
</html>
